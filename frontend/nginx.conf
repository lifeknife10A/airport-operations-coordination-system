server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to index.html so client-side
    # routing (react-router) handles it, instead of nginx 404ing on a refresh of e.g. /tracker.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dev server's vite.config.ts proxies /api -> localhost:8080 for local development; this
    # is the same idea for the built static site, proxying to the backend container by its
    # compose service name instead of localhost.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed build assets aggressively; index.html itself must never be cached or a
    # deployed update won't be picked up until the cache expires.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
