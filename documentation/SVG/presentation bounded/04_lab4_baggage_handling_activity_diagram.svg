<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <text x="40" y="35" fill="#000000" font-size="18" font-weight="bold">Saphire AOCS — UML Activity Diagram: Baggage Handling System (BHS) (Lab 04)</text>

  <!-- Swimlanes -->
  <rect x="50" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="83" text-anchor="middle" font-size="13" font-weight="bold">Check-In Desk</text>

  <rect x="350" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="83" text-anchor="middle" font-size="13" font-weight="bold">3D CT Security Screening</text>

  <rect x="650" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="800" y="83" text-anchor="middle" font-size="13" font-weight="bold">Tilt-Tray Sorter</text>

  <rect x="950" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="83" text-anchor="middle" font-size="13" font-weight="bold">Apron &amp; Cargo Hold</text>

  <line x1="350" y1="60" x2="350" y2="760" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="650" y1="60" x2="650" y2="760" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="950" y1="60" x2="950" y2="760" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Nodes -->
  <circle cx="200" cy="120" r="12" fill="#000000"/>

  <rect x="100" y="160" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="187" text-anchor="middle" font-size="12">Weigh &amp; Attach Bag Tag</text>

  <rect x="100" y="240" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="267" text-anchor="middle" font-size="12">Log CHECKIN_DESK Scan</text>

  <rect x="400" y="240" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="267" text-anchor="middle" font-size="12">Inline 3D CT Screening</text>

  <!-- Decision Diamond -->
  <polygon points="500,320 560,355 500,390 440,355" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="359" text-anchor="middle" font-size="11">Cleared?</text>

  <!-- Level 3 Manual -->
  <rect x="400" y="450" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="472" text-anchor="middle" font-size="11">Level 3 Physical Search</text>
  <text x="500" y="486" text-anchor="middle" font-size="10" fill="#555555">Officer Clearance Log</text>

  <!-- Tilt Sorter -->
  <rect x="700" y="332" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="800" y="359" text-anchor="middle" font-size="12">Laser Barcode Routing</text>

  <rect x="700" y="420" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="800" y="447" text-anchor="middle" font-size="12">Divert to Flight Lateral Pier</text>

  <!-- Apron ULD Stowing -->
  <rect x="1000" y="420" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="442" text-anchor="middle" font-size="12">Scan &amp; Stow in ULD</text>
  <text x="1100" y="457" text-anchor="middle" font-size="10" fill="#555555">status = 'LOADED'</text>

  <!-- Belly Loading -->
  <rect x="1000" y="520" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="547" text-anchor="middle" font-size="12">Load Bulk Cargo Hold</text>

  <!-- Reclaim Carousel -->
  <rect x="1000" y="620" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="642" text-anchor="middle" font-size="12">Induct Claim Carousel</text>
  <text x="1100" y="657" text-anchor="middle" font-size="10" fill="#555555">status = 'CLAIMED'</text>

  <!-- End Node -->
  <circle cx="1100" cy="720" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="1100" cy="720" r="8" fill="#000000"/>

  <!-- Lines -->
  <line x1="200" y1="132" x2="200" y2="160" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="205" x2="200" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="300" y1="262" x2="400" y2="262" stroke="#000000" stroke-width="1.5"/>
  <line x1="500" y1="285" x2="500" y2="320" stroke="#000000" stroke-width="1.5"/>

  <line x1="560" y1="355" x2="700" y2="355" stroke="#000000" stroke-width="1.5"/>
  <text x="610" y="347" font-size="11" font-weight="bold">[Yes / Clear]</text>

  <line x1="500" y1="390" x2="500" y2="450" stroke="#000000" stroke-width="1.5"/>
  <text x="510" y="420" font-size="11" font-weight="bold">[Flagged]</text>

  <line x1="600" y1="472" x2="800" y2="472" stroke="#000000" stroke-width="1.5"/>
  <line x1="800" y1="472" x2="800" y2="377" stroke="#000000" stroke-width="1.5"/>

  <line x1="800" y1="377" x2="800" y2="420" stroke="#000000" stroke-width="1.5"/>
  <line x1="900" y1="442" x2="1000" y2="442" stroke="#000000" stroke-width="1.5"/>
  <line x1="1100" y1="465" x2="1100" y2="520" stroke="#000000" stroke-width="1.5"/>
  <line x1="1100" y1="565" x2="1100" y2="620" stroke="#000000" stroke-width="1.5"/>
  <line x1="1100" y1="665" x2="1100" y2="706" stroke="#000000" stroke-width="1.5"/>
</svg>
