<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" width="1300" height="860" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <text x="40" y="35" fill="#000000" font-size="18" font-weight="bold">Saphire AOCS — UML Activity Diagram: Aircraft Turnaround Sequence (Lab 04)</text>

  <!-- Swimlane Headers -->
  <rect x="50" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="83" text-anchor="middle" font-size="13" font-weight="bold">Flight Ops &amp; ATC</text>

  <rect x="350" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="83" text-anchor="middle" font-size="13" font-weight="bold">Ramp Ground Handling</text>

  <rect x="650" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="800" y="83" text-anchor="middle" font-size="13" font-weight="bold">Fuel &amp; Cabin Services</text>

  <rect x="950" y="60" width="300" height="35" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="83" text-anchor="middle" font-size="13" font-weight="bold">Passenger Boarding</text>

  <!-- Swimlane Dividers -->
  <line x1="350" y1="60" x2="350" y2="820" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="650" y1="60" x2="650" y2="820" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="950" y1="60" x2="950" y2="820" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Start Node -->
  <circle cx="200" cy="130" r="12" fill="#000000"/>

  <!-- Step 1: Land & Dock -->
  <rect x="100" y="170" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="197" text-anchor="middle" font-size="12">Land &amp; Taxi to Stand</text>

  <!-- Step 2: On-Block & Jetbridge -->
  <rect x="100" y="245" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="272" text-anchor="middle" font-size="12">Dock PBB Jetbridge &amp; GPU</text>

  <!-- Step 3: Deboard Pax -->
  <rect x="1000" y="245" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="272" text-anchor="middle" font-size="12">Deboard Inbound Pax</text>

  <!-- Fork Bar -->
  <rect x="100" y="340" width="1100" height="8" rx="2" fill="#000000"/>

  <!-- Parallel Branch 1: Baggage Offload/Upload -->
  <rect x="400" y="390" width="200" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="413" text-anchor="middle" font-size="11">Offload Inbound Bags &amp;</text>
  <text x="500" y="428" text-anchor="middle" font-size="11">Load Outbound ULDs</text>

  <!-- Parallel Branch 2: Fueling -->
  <rect x="670" y="390" width="125" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="732" y="413" text-anchor="middle" font-size="11">Apron Hydrant</text>
  <text x="732" y="428" text-anchor="middle" font-size="11">Fueling</text>

  <!-- Parallel Branch 3: Cabin Cleaning -->
  <rect x="810" y="390" width="125" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="872" y="413" text-anchor="middle" font-size="11">Cabin Cleaning &amp;</text>
  <text x="872" y="428" text-anchor="middle" font-size="11">Sanitization</text>

  <!-- Parallel Branch 4: Catering -->
  <rect x="400" y="480" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="507" text-anchor="middle" font-size="11">High-Loader Catering</text>

  <!-- Join Bar -->
  <rect x="100" y="570" width="1100" height="8" rx="2" fill="#000000"/>

  <!-- Board Pax -->
  <rect x="1000" y="620" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1100" y="647" text-anchor="middle" font-size="12">Board Outbound Pax</text>

  <!-- Verify Loadsheet -->
  <rect x="100" y="620" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="647" text-anchor="middle" font-size="12">Verify Final Loadsheet</text>

  <!-- Pushback & Depart -->
  <rect x="100" y="705" width="200" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="732" text-anchor="middle" font-size="12">Pushback &amp; Taxi to Runway</text>

  <!-- End Node -->
  <circle cx="200" cy="795" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="200" cy="795" r="8" fill="#000000"/>

  <!-- Connector Lines -->
  <line x1="200" y1="142" x2="200" y2="170" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="215" x2="200" y2="245" stroke="#000000" stroke-width="1.5"/>
  <line x1="300" y1="267" x2="1000" y2="267" stroke="#000000" stroke-width="1.5"/>
  <line x1="1100" y1="290" x2="1100" y2="340" stroke="#000000" stroke-width="1.5"/>

  <line x1="500" y1="348" x2="500" y2="390" stroke="#000000" stroke-width="1.5"/>
  <line x1="732" y1="348" x2="732" y2="390" stroke="#000000" stroke-width="1.5"/>
  <line x1="872" y1="348" x2="872" y2="390" stroke="#000000" stroke-width="1.5"/>
  <line x1="500" y1="440" x2="500" y2="480" stroke="#000000" stroke-width="1.5"/>

  <line x1="500" y1="525" x2="500" y2="570" stroke="#000000" stroke-width="1.5"/>
  <line x1="732" y1="440" x2="732" y2="570" stroke="#000000" stroke-width="1.5"/>
  <line x1="872" y1="440" x2="872" y2="570" stroke="#000000" stroke-width="1.5"/>

  <line x1="1100" y1="578" x2="1100" y2="620" stroke="#000000" stroke-width="1.5"/>
  <line x1="1000" y1="642" x2="300" y2="642" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="665" x2="200" y2="705" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="750" x2="200" y2="781" stroke="#000000" stroke-width="1.5"/>
</svg>
