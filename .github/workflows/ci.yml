name: CI

# Backend: unit tests, then a real boot against a Postgres 16 service so the whole Flyway chain
# (schema + the ~158k-row demo dataset) is applied from an empty database -- the unit tests never
# touch a database, so only this step catches a broken migration. Frontend: typecheck + build.
# Both Docker images are built to catch a broken Dockerfile.

on:
  push:
    branches: [main, Anuvrat, anay, krishna]
  pull_request:
    branches: [main, Anuvrat, anay, krishna]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aocs_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aocs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Unit tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Package (proves the Docker build's own package step still works)
        working-directory: backend
        run: ./mvnw -B -q clean package -DskipTests

      - name: Boot test - apply every migration to an empty Postgres 16 and start the app
        working-directory: backend
        env:
          DB_PASSWORD: postgres
        run: |
          java -jar target/aocs-backend-*.jar > boot.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend UP after ~$((i*3))s"
              curl -fsS "http://localhost:8080/api/flights/paged?size=1" | grep -q '"totalElements":5000'
              exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy"; tail -n 80 boot.log; exit 1

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t aocs-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck + build
        working-directory: frontend
        run: pnpm run build

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t aocs-frontend:ci .
