name: CI

# No CI existed at all before this -- every change reached the repo with nothing but a developer's
# own local run (or none) verifying it. This runs the backend test suite against a real Postgres
# (not mocks, which is exactly how the flight-status and delay-log constraint mismatches slipped
# through originally), typechecks and builds the frontend, and builds both Docker images to catch
# a broken Dockerfile before it's someone's deploy-day surprise.

on:
  push:
    branches: [main, Anuvrat, anay, krishna]
  pull_request:
    branches: [main, Anuvrat, anay, krishna]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aocs_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aocs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run test suite (real Postgres, not mocks)
        working-directory: backend
        run: ./mvnw -B test
        env:
          # The default fallbacks in application.properties are fine for CI -- this is exactly
          # the throwaway database the "postgres" service above just created.
          DB_PASSWORD: postgres

      - name: Package (proves the Docker build's own package step still works)
        working-directory: backend
        run: ./mvnw -B -q clean package -DskipTests

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t aocs-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck + build
        working-directory: frontend
        run: pnpm run build

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t aocs-frontend:ci .
