<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif">
<defs>
<marker id="br" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0284C7"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FAF9F6"/>
<rect width="1920" height="8" fill="#1E3A5F"/>
<rect width="520" height="8" fill="#0284C7"/>
<text x="60" y="92" font-size="46" font-weight="800" fill="#0F2942">APPENDIX B — SESSION SECURITY &amp; REVOCATION</text>
<text x="60" y="132" font-size="21" fill="#475569">JWT proves a token was issued · auth_sessions proves it is still allowed · the role is always read from the database, never from the token.</text>

<rect x="60" y="164" width="560" height="44" rx="22" fill="#0284C7"/>
<text x="82" y="193" font-size="19" font-weight="700" fill="#FFFFFF">1 · LOGIN — POST /api/auth/login</text>
<rect x="60" y="230" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="82" y="272" font-size="19" font-weight="800" fill="#0F2942">01 · Browser</text>
<text x="82" y="306" font-size="15.5" fill="#475569">Operator submits username</text>
<text x="82" y="332" font-size="15.5" fill="#475569">or email + password.</text>
<rect x="425" y="230" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="447" y="272" font-size="19" font-weight="800" fill="#0F2942">02 · AuthController</text>
<text x="447" y="306" font-size="15.5" fill="#475569">Lockout gate: 5 fails per</text>
<text x="447" y="332" font-size="15.5" fill="#475569">15 min per user; 30 per IP;</text>
<text x="447" y="358" font-size="15.5" fill="#475569">→ HTTP 429.</text>
<rect x="790" y="230" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="812" y="272" font-size="19" font-weight="800" fill="#0F2942">03 · AuthService</text>
<text x="812" y="306" font-size="15.5" fill="#475569">bcrypt matches() + SUSPENDED</text>
<text x="812" y="332" font-size="15.5" fill="#475569">check; generic 401 message</text>
<text x="812" y="358" font-size="15.5" fill="#475569">on any failure.</text>
<rect x="1155" y="230" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1177" y="272" font-size="19" font-weight="800" fill="#0F2942">04 · SessionService</text>
<text x="1177" y="306" font-size="15.5" fill="#475569">Revoke prior sessions</text>
<text x="1177" y="332" font-size="15.5" fill="#475569">(SUPERSEDED_BY_NEW_LOGIN)</text>
<text x="1177" y="358" font-size="15.5" fill="#475569">→ INSERT auth_sessions row.</text>
<rect x="1520" y="230" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1542" y="272" font-size="19" font-weight="800" fill="#0F2942">05 · JwtService</text>
<text x="1542" y="306" font-size="15.5" fill="#475569">HS256 JWT + sid claim,</text>
<text x="1542" y="332" font-size="15.5" fill="#475569">exp 24 h. Role claim is</text>
<text x="1542" y="358" font-size="15.5" fill="#475569">never trusted on the way back.</text>
<line x1="402" y1="305" x2="422" y2="305" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="767" y1="305" x2="787" y2="305" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="1132" y1="305" x2="1152" y2="305" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="1497" y1="305" x2="1517" y2="305" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<rect x="60" y="478" width="640" height="44" rx="22" fill="#0284C7"/>
<text x="82" y="507" font-size="19" font-weight="700" fill="#FFFFFF">2 · EVERY API REQUEST — JwtAuthFilter</text>
<rect x="60" y="544" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="82" y="586" font-size="19" font-weight="800" fill="#0F2942">01 · Bearer token</text>
<text x="82" y="620" font-size="15.5" fill="#475569">Authorization header sent</text>
<text x="82" y="646" font-size="15.5" fill="#475569">by the axios interceptor.</text>
<rect x="425" y="544" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="447" y="586" font-size="19" font-weight="800" fill="#0F2942">02 · Signature verify</text>
<text x="447" y="620" font-size="15.5" fill="#475569">JwtService.parse(): HS256</text>
<text x="447" y="646" font-size="15.5" fill="#475569">signature + expiry; failure</text>
<text x="447" y="672" font-size="15.5" fill="#475569">→ simply unauthenticated.</text>
<rect x="790" y="544" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="812" y="586" font-size="19" font-weight="800" fill="#0F2942">03 · Session lookup</text>
<text x="812" y="620" font-size="15.5" fill="#475569">findActiveSession(sid):</text>
<text x="812" y="646" font-size="15.5" fill="#475569">revoked_at IS NULL AND</text>
<text x="812" y="672" font-size="15.5" fill="#475569">expires_at &gt; now().</text>
<rect x="1155" y="544" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1177" y="586" font-size="19" font-weight="800" fill="#0F2942">04 · Identity from DB</text>
<text x="1177" y="620" font-size="15.5" fill="#475569">Load user by id; the role</text>
<text x="1177" y="646" font-size="15.5" fill="#475569">is read from the DB — a stale</text>
<text x="1177" y="672" font-size="15.5" fill="#475569">token claim changes nothing.</text>
<rect x="1520" y="544" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1542" y="586" font-size="19" font-weight="800" fill="#0F2942">05 · Authorize</text>
<text x="1542" y="620" font-size="15.5" fill="#475569">SUSPENDED? → no session.</text>
<text x="1542" y="646" font-size="15.5" fill="#475569">SecurityContext + per-endpoint</text>
<text x="1542" y="672" font-size="15.5" fill="#475569">@PreAuthorize role rules.</text>
<line x1="402" y1="619" x2="422" y2="619" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="767" y1="619" x2="787" y2="619" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="1132" y1="619" x2="1152" y2="619" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<line x1="1497" y1="619" x2="1517" y2="619" stroke="#0284C7" stroke-width="2.5" marker-end="url(#br)"/>
<rect x="60" y="792" width="800" height="44" rx="22" fill="#0284C7"/>
<text x="82" y="821" font-size="19" font-weight="700" fill="#FFFFFF">3 · REVOCATION TRIGGERS → NEXT CALL FAILS CLOSED (401)</text>
<rect x="60" y="856" width="570" height="126" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="84" y="896" font-size="19" font-weight="800" fill="#0F2942">01 · Logout</text>
<text x="84" y="928" font-size="15.5" fill="#475569">POST /api/auth/logout → row</text>
<text x="84" y="954" font-size="15.5" fill="#475569">revoked_reason = 'LOGOUT'.</text>
<rect x="660" y="856" width="570" height="126" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="684" y="896" font-size="19" font-weight="800" fill="#0F2942">02 · Login elsewhere</text>
<text x="684" y="928" font-size="15.5" fill="#475569">Single session per user: the old</text>
<text x="684" y="954" font-size="15.5" fill="#475569">row = 'SUPERSEDED_BY_NEW_LOGIN'.</text>
<rect x="1260" y="856" width="570" height="126" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1284" y="896" font-size="19" font-weight="800" fill="#0F2942">03 · Admin suspension</text>
<text x="1284" y="928" font-size="15.5" fill="#475569">revokeAllForUser() — suspending</text>
<text x="1284" y="954" font-size="15.5" fill="#475569">an account kills every active session.</text>
<rect x="60" y="1004" width="1800" height="52" rx="12" fill="#0F2942"/>
<text x="84" y="1037" font-size="15.5" fill="#E2E8F0" font-family="ui-monospace, Menlo, Consolas, monospace">auth_sessions · session_id UUID PK | user_id FK → users | issued_at | expires_at | revoked_at | revoked_reason      partial index (user_id) WHERE revoked_at IS NULL</text>
</svg>
