<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1E3A5F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FAF9F6"/>
<rect width="1920" height="8" fill="#1E3A5F"/>
<rect width="520" height="8" fill="#0284C7"/>
<text x="60" y="92" font-size="46" font-weight="800" fill="#0F2942">APPENDIX A — STATE MACHINES</text>
<text x="60" y="132" font-size="21" fill="#475569">FlightStatus.canTransitionTo() · TaskStatus.canTransitionTo() — one source of truth in code. Illegal jumps are rejected with 409 Conflict, never written to the database.</text>

<rect x="60" y="164" width="440" height="44" rx="22" fill="#0284C7"/>
<text x="82" y="193" font-size="19" font-weight="700" fill="#FFFFFF">FLIGHT LIFECYCLE — 10 STATES</text>

<rect x="60" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="147" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">SCHEDULED</text>
<rect x="292" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="379" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">LANDED</text>
<rect x="524" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="611" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">ON_BLOCK</text>
<rect x="756" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="843" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">SERVICING</text>
<rect x="988" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="1075" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">READY</text>
<rect x="1220" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="1307" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">BOARDING</text>
<rect x="1452" y="280" width="175" height="68" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="1539" y="323" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">AIRBORNE</text>
<rect x="1684" y="280" width="175" height="68" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
<text x="1771" y="323" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">DEPARTED</text>

<line x1="238" y1="314" x2="288" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="470" y1="314" x2="520" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="702" y1="314" x2="752" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="934" y1="314" x2="984" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1166" y1="314" x2="1216" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1398" y1="314" x2="1448" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1630" y1="314" x2="1680" y2="314" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="60" y="392" font-size="17" fill="#475569">• SCHEDULED may also enter BOARDING directly — a pure-departure leg with no arrival-at-SPH row.</text>

<rect x="60" y="430" width="850" height="165" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="90" y="478" font-size="24" font-weight="800" fill="#92400E">DELAYED — the 9th reachable state</text>
<text x="90" y="516" font-size="17.5" fill="#78350F">Reachable from every state except AIRBORNE, DEPARTED and CANCELLED.</text>
<text x="90" y="546" font-size="17.5" fill="#78350F">Resumes into any normal stage — or is cancelled.</text>
<text x="90" y="576" font-size="17.5" fill="#78350F">Why it is late lives in delay_logs (IATA codes D01–D25).</text>

<rect x="970" y="430" width="890" height="165" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
<text x="1000" y="478" font-size="24" font-weight="800" fill="#991B1B">CANCELLED — terminal</text>
<text x="1000" y="516" font-size="17.5" fill="#7F1D1D">Reachable from every state except DEPARTED.</text>
<text x="1000" y="546" font-size="17.5" fill="#7F1D1D">No outgoing transitions — a cancelled flight never resumes.</text>
<text x="1000" y="576" font-size="17.5" fill="#7F1D1D">Retained for audit; live boards filter it out.</text>

<path d="M1080 348 V 424" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
<text x="1068" y="400" font-size="15" fill="#92400E" text-anchor="end">→ becomes DELAYED</text>
<path d="M1146 424 V 352" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
<text x="1156" y="400" font-size="15" fill="#92400E">resumes →</text>
<path d="M1500 348 V 422" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
<text x="1514" y="400" font-size="15" fill="#991B1B">→ CANCELLED (except DEPARTED)</text>

<text x="60" y="650" font-size="17" fill="#475569">Illegal examples: SCHEDULED → DEPARTED (skips six stages) · re-opening DEPARTED/CANCELLED · task PENDING → COMPLETED.</text>

<line x1="60" y1="686" x2="1860" y2="686" stroke="#E5E7EB" stroke-width="2"/>

<rect x="60" y="714" width="560" height="44" rx="22" fill="#0284C7"/>
<text x="82" y="743" font-size="19" font-weight="700" fill="#FFFFFF">TURNAROUND TASK LIFECYCLE — 4 STATES</text>
<rect x="420" y="790" width="170" height="64" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="505" y="831" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">PENDING</text>
<rect x="780" y="790" width="210" height="64" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
<text x="885" y="831" font-size="20" font-weight="700" fill="#0F2942" text-anchor="middle">IN_PROGRESS</text>
<rect x="1160" y="790" width="190" height="64" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
<text x="1255" y="831" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">COMPLETED</text>
<rect x="780" y="928" width="210" height="60" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
<text x="885" y="966" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">BLOCKED</text>
<line x1="590" y1="822" x2="777" y2="822" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="990" y1="822" x2="1157" y2="822" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="885" y1="856" x2="885" y2="926" stroke="#1E3A5F" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path d="M505 856 C505 942 700 958 776 958" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
<text x="540" y="992" font-size="15" fill="#64748B">PENDING → BLOCKED (dashed)</text>
<text x="903" y="898" font-size="14" fill="#64748B">blocks / resumes</text>
<text x="1385" y="806" font-size="16" fill="#475569">COMPLETED is terminal — no outgoing transitions.</text>
<text x="1385" y="836" font-size="16" fill="#475569">You cannot skip IN_PROGRESS (PENDING → COMPLETED).</text>
<text x="1385" y="866" font-size="16" fill="#475569">That removed the old "fake actualStart" workaround.</text>

<text x="60" y="1035" font-size="15" fill="#94A3B8">Source of truth: backend/src/main/java/com/saphire/aocs/entity/FlightStatus.java · TaskStatus.java — verified against the shipped code.</text>
</svg>
