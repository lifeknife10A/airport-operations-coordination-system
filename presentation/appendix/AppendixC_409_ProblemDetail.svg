<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif">
<rect width="1920" height="1080" fill="#FAF9F6"/>
<rect width="1920" height="8" fill="#1E3A5F"/>
<rect width="520" height="8" fill="#0284C7"/>
<text x="60" y="92" font-size="46" font-weight="800" fill="#0F2942">APPENDIX C — ERROR CONTRACT: RFC 7807 ProblemDetail</text>
<text x="60" y="132" font-size="21" fill="#475569">One handler (GlobalExceptionHandler) · one shape · one correlationId — the same id appears in the X-Correlation-Id header and every server log line for the request.</text>

<rect x="60" y="180" width="840" height="580" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="90" y="212" width="470" height="42" rx="21" fill="#0284C7"/>
<text x="110" y="240" font-size="18" font-weight="700" fill="#FFFFFF">REQUEST — CONFLICT ON GATE ASSIGN</text>
<text x="90" y="300" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">PUT /api/gates/assign</text>
<text x="90" y="332" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">Authorization: Bearer eyJhbGciOiJIUzI1NiJ9…</text>
<text x="90" y="364" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">Content-Type: application/json</text>
<text x="90" y="400" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">{</text>
<text x="90" y="432" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "flightId": 4821,</text>
<text x="90" y="464" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "gateId": 12,</text>
<text x="90" y="496" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "standId": 23</text>
<text x="90" y="528" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">}</text>
<text x="90" y="600" font-size="17" font-weight="700" fill="#0F2942">Why it fails:</text>
<text x="90" y="630" font-size="16" fill="#475569">GateService runs wingspan-fit and occupancy-overlap</text>
<text x="90" y="656" font-size="16" fill="#475569">checks inside a PESSIMISTIC_WRITE lock, so two</text>
<text x="90" y="682" font-size="16" fill="#475569">concurrent assignments cannot both win.</text>
<rect x="960" y="180" width="900" height="580" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="990" y="212" width="520" height="42" rx="21" fill="#B91C1C"/>
<text x="1010" y="240" font-size="18" font-weight="700" fill="#FFFFFF">RESPONSE — HTTP/1.1 409 CONFLICT</text>
<text x="990" y="300" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">HTTP/1.1 409 Conflict</text>
<text x="990" y="330" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">Content-Type: application/problem+json</text>
<text x="990" y="360" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">X-Correlation-Id: e3f1c9a2-7b64-4d1e-9d2a-1f8b3c5e7a90</text>
<text x="990" y="396" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">{</text>
<text x="990" y="426" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "type": "https://api.saphire-aocs.example/problems/state-conflict",</text>
<text x="990" y="456" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "title": "Conflict",</text>
<text x="990" y="486" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "status": 409,</text>
<text x="990" y="516" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "detail": "Gate A12 is already reserved for flight 6E-521 during</text>
<text x="990" y="546" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">             ground occupancy window (2026-09-14T10:05+05:30 to 11:20+05:30)",</text>
<text x="990" y="576" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "instance": "/api/gates/assign",</text>
<text x="990" y="606" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "timestamp": "2026-09-14T10:02:11.482Z",</text>
<text x="990" y="636" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">  "correlationId": "e3f1c9a2-7b64-4d1e-9d2a-1f8b3c5e7a90"</text>
<text x="990" y="666" font-size="17" fill="#0F2942" font-family="ui-monospace, Menlo, Consolas, monospace">}</text>
<text x="990" y="706" font-size="16" fill="#475569">Wingspan rule returns the same shape: "…does not fit gate A12, which is rated for 36.0 m."</text>
<text x="990" y="730" font-size="16" fill="#475569">The same correlationId is in the header and in every log line (MDC) for this request.</text>

<rect x="60" y="800" width="348" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="84" y="852" font-size="30" font-weight="800" fill="#0284C7">400</text>
<text x="84" y="888" font-size="17" font-weight="700" fill="#0F2942">Bad Request</text>
<text x="84" y="922" font-size="15" fill="#475569">Validation failed / malformed</text>
<text x="84" y="946" font-size="15" fill="#475569">input / DB CHECK violation.</text>
<rect x="423" y="800" width="348" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="447" y="852" font-size="30" font-weight="800" fill="#64748B">401</text>
<text x="447" y="888" font-size="17" font-weight="700" fill="#0F2942">Unauthorized</text>
<text x="447" y="922" font-size="15" fill="#475569">No / expired / revoked session.</text>
<text x="447" y="946" font-size="15" fill="#475569">Frontend redirects to /login.</text>
<rect x="786" y="800" width="348" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="810" y="852" font-size="30" font-weight="800" fill="#7C3AED">403</text>
<text x="810" y="888" font-size="17" font-weight="700" fill="#0F2942">Forbidden</text>
<text x="810" y="922" font-size="15" fill="#475569">Valid session, wrong role —</text>
<text x="810" y="946" font-size="15" fill="#475569">raised by @PreAuthorize.</text>
<rect x="1149" y="800" width="348" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1173" y="852" font-size="30" font-weight="800" fill="#EF4444">409</text>
<text x="1173" y="888" font-size="17" font-weight="700" fill="#0F2942">Conflict</text>
<text x="1173" y="922" font-size="15" fill="#475569">Legal request, illegal state:</text>
<text x="1173" y="946" font-size="15" fill="#475569">gate busy / bad transition.</text>
<rect x="1512" y="800" width="348" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1536" y="852" font-size="30" font-weight="800" fill="#F59E0B">429</text>
<text x="1536" y="888" font-size="17" font-weight="700" fill="#0F2942">Too Many Requests</text>
<text x="1536" y="922" font-size="15" fill="#475569">Login lockout (5 / 15 min, 30 per</text>
<text x="1536" y="946" font-size="15" fill="#475569">IP) + Retry-After header.</text>

<text x="60" y="1048" font-size="15" fill="#94A3B8">One handler builds this whole shape: backend/src/main/java/com/saphire/aocs/exception/GlobalExceptionHandler.java — type · title · status · detail · instance · timestamp · correlationId.</text>
</svg>
