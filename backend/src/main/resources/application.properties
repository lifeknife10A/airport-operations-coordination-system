# App Name & Server Port
spring.application.name=saphire-aocs-backend
server.port=8080

# PostgreSQL Database Connection
# Password (and the JWT secret below) used to be hardcoded here with no override path at all --
# this file is committed to git. Now reads from an env var first, falling back to the same local
# dev value so nothing breaks on this machine; any real deployment MUST set DB_PASSWORD (and
# AOCS_JWT_SECRET below) as actual environment variables rather than relying on the fallback.
spring.datasource.url=jdbc:postgresql://localhost:5432/aocs_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tried setting this to false (it defaults to true, and it papers over lazy-loading N+1s by
# quietly opening a second Hibernate session per request during JSON serialization). Reverted:
# turning it off threw real LazyInitializationExceptions on 6 different live endpoints --
# AirlineBillingController, BaggageController and BorderControlController all return JPA entities
# directly (no DTO), and Jackson walks their full association graph during serialization,
# including LAZY associations several hops deep (e.g. InvoiceLineItem.invoice, and Airport reached
# transitively through Passenger/BagTag -> Flight -> Airport). Fixing this safely means converting
# all of those raw-entity responses to real DTOs -- five-plus controllers' worth of work -- not a
# one-line config flip. Left at the default (true) rather than shipping endpoints that 500.
#spring.jpa.open-in-view=false

# Flyway Database Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Actuator & CORS Configuration
# Was include=* -- that exposed /actuator/env (dumps every env var, including aocs.jwt.secret
# below), /actuator/heapdump (a full JVM memory snapshot, PII and all), and /actuator/shutdown
# (kills the app), all unauthenticated since /actuator/** isn't under the /api/** prefix
# SecurityConfig gates. Restricted to just a health check, which is all this project uses today.
management.endpoints.web.exposure.include=health

# JWT Security Configuration
# No default secret on purpose: a fallback committed to a public repo lets anyone forge tokens
# (the earlier committed values must be treated as compromised). When AOCS_JWT_SECRET is unset,
# JwtService generates a random per-run secret (logged as a warning), so local dev still works
# but sessions end on restart. Set AOCS_JWT_SECRET (32+ chars) for any shared or deployed run;
# application-prod.properties requires it.
aocs.jwt.secret=${AOCS_JWT_SECRET:}
aocs.jwt.expiration-ms=86400000

# Login brute-force protection (see LoginAttemptService): after max-failures bad attempts for one
# username within window-seconds that username is locked for lock-seconds; max-failures-per-ip
# does the same per client address so guesses can't be sprayed across many usernames.
aocs.security.login.max-failures=5
aocs.security.login.max-failures-per-ip=30
aocs.security.login.window-seconds=900
aocs.security.login.lock-seconds=900

# Upper bound for any endpoint that takes a Spring Data Pageable (the default cap is 2000 rows).
spring.data.web.pageable.max-page-size=100
