# App Name & Server Port
spring.application.name=saphire-aocs-backend
server.port=8080

# PostgreSQL Database Connection
# Password (and the JWT secret below) used to be hardcoded here with no override path at all --
# this file is committed to git. Now reads from an env var first, falling back to the same local
# dev value so nothing breaks on this machine; any real deployment MUST set DB_PASSWORD (and
# AOCS_JWT_SECRET below) as actual environment variables rather than relying on the fallback.
spring.datasource.url=jdbc:postgresql://localhost:5432/aocs_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Actuator & CORS Configuration
# Was include=* -- that exposed /actuator/env (dumps every env var, including aocs.jwt.secret
# below), /actuator/heapdump (a full JVM memory snapshot, PII and all), and /actuator/shutdown
# (kills the app), all unauthenticated since /actuator/** isn't under the /api/** prefix
# SecurityConfig gates. Restricted to just a health check, which is all this project uses today.
management.endpoints.web.exposure.include=health

# JWT Security Configuration
# Rotated: the previous value was committed to git across multiple commits, so it must be treated
# as permanently compromised (anyone with repo/clone access could forge a valid token for any
# user) regardless of this new value. Same override pattern as the DB password above -- set
# AOCS_JWT_SECRET as a real environment variable in any shared or deployed environment.
aocs.jwt.secret=${AOCS_JWT_SECRET:44390917d5dd7e26a878da200e4ab2296ebce395110e0fa3064167bf47f36624}
aocs.jwt.expiration-ms=86400000

