# Activate with --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod). Properties here
# override application.properties; anything not overridden (server.port, Flyway settings, actuator
# exposure, the login lockout thresholds, the pageable size cap) is inherited unchanged.
#
# The whole point of this file is that every value below is a REQUIRED environment variable with
# NO fallback default. application.properties intentionally has dev-friendly fallbacks so the app
# still boots on a laptop with nothing configured; this profile intentionally has none, so it is
# impossible to accidentally run in production on the default JWT secret or the word "postgres" as
# a database password. Deploying without setting these env vars fails app startup immediately with
# a clear "could not resolve placeholder" error, rather than running insecurely.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

aocs.jwt.secret=${AOCS_JWT_SECRET}

# The real frontend origin(s), comma-separated -- e.g. https://ops.saphire-aocs.example. The
# default in SecurityConfig only covers localhost, which would silently block every request from
# a real deployed frontend.
aocs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Quieter and no SQL bodies in logs outside local dev.
spring.jpa.show-sql=false
logging.level.com.saphire.aocs=INFO
logging.level.org.hibernate.SQL=WARN
